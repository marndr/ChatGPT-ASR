[project]
name = "chat-gpt-asr"
version = "0.1.0"
authors = [{name = "Maryam Naderi", email = "maryam.naderi@idiap.ch"}]

[tool.ruff]
target-version = "py310"
lint.select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "E501",  # line too long
    "E741",  # ambiguous variable name
    "E722",  # bare except
]
