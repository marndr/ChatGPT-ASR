default:
  image: python:3.10
  tags:
    - docker
    - linux

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - build
  - test

build-job:
  stage: build
  script:
    - pip install --upgrade pip
    - pip install . --no-cache

style_convention:
  stage: test
  script:
    - pip install pre-commit
    - pre-commit run --all-files
